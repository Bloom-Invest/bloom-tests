name: e2e

# Runs the Playwright + Grok-vision E2E suite against the live Bloom app.
# Replaces Stably's hosted cloud runner (removed alongside the SDK).
# The post-Bloom-merge run lives in Bloom-Invest/bloom's e2e workflow; here we
# only run on suite-PRs and on manual dispatch.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'tests/**'
      - 'playwright.config.ts'
      - 'playwright.global-setup.ts'
      - 'package.json'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run E2E (all-tests)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BASE_URL: https://bloom.onrender.com
        run: npx playwright test --project all-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
